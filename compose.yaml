# Standalone smoke test for this service only (not production topology).
services:
  mongodb:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: uam
      MONGO_INITDB_ROOT_PASSWORD: CHANGE_ME_DB_PASSWORD
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      retries: 5

  uam-backend:
    build: .
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      NODE_ENV: production
      MONGODB_URI: mongodb://uam:CHANGE_ME_DB_PASSWORD@mongodb:27017/uam?authSource=admin
      JWT_ACCESS_SECRET: CHANGE_ME_JWT_ACCESS_SECRET
      JWT_REFRESH_SECRET: CHANGE_ME_JWT_REFRESH_SECRET
      JWT_ISSUER: api-gateway-auth-server
      JWT_AUDIENCE: api-gateway-clients
      PASSWORD_PEPPER: CHANGE_ME_PASSWORD_PEPPER
      AUTO_VERIFY_EMAIL: "true"
      AUTH_OMIT_REFRESH_IN_BODY: "true"
      COOKIE_SECURE: "false"
    depends_on:
      mongodb:
        condition: service_healthy
